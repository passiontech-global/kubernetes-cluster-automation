$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'go'
layer: 'application'
stack: 'backend'
tags:
  - 'docker'

# hostkit change -> this project's tasks are affected (moon ci).
dependsOn:
  - 'hostkit'

project:
  title: 'webhook-dispatcher'
  description: 'GitHub org webhook fan-out to Concourse resource check webhooks (push/release/tag-create -> git, pull_request -> github-pr).'

tasks:
  # test/vet/lint are defined globally in .moon/tasks/all.yml — the inputs
  # below MERGE with the global list. hostkit is compiled into this module
  # via the go.mod `replace ../../libs/hostkit`, so its sources must
  # invalidate every cache that depends on compiled code (and let
  # `moon ci` treat a touched hostkit file as affecting these tasks).
  test:
    inputs:
      - '/libs/hostkit/**/*.go'
      - '/libs/hostkit/go.mod'

  vet:
    inputs:
      - '/libs/hostkit/**/*.go'
      - '/libs/hostkit/go.mod'

  lint:
    inputs:
      - '/libs/hostkit/**/*.go'
      - '/libs/hostkit/go.mod'
      # golangci-lint resolves its config by walking up to the repo root.
      - '/.golangci.yml'

  build:
    script: 'CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=${VERSION:-dev}" -o bin/webhook-dispatcher ./cmd/dispatcher'
    toolchains: 'system'
    options:
      # script contains an inline env assignment — must run via shell.
      shell: true
    inputs:
      - '$VERSION'
      - 'cmd/**/*.go'
      - 'internal/**/*.go'
      - 'go.mod'
      - 'go.sum'
      - '/libs/hostkit/**/*.go'
      - '/libs/hostkit/go.mod'
    outputs:
      - 'bin/webhook-dispatcher'

  image:
    script: 'ko build --bare --sbom=none --tags "${TAGS:-latest}" ./cmd/dispatcher'
    toolchains: 'system'
    inputs:
      - 'cmd/**/*.go'
      - 'internal/**/*.go'
      - 'go.mod'
      - 'go.sum'
      - '.ko.yaml'
      - '/libs/hostkit/**/*.go'
      - '/libs/hostkit/go.mod'
    options:
      cache: false
