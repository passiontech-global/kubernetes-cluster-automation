# ko build config — replaces the Dockerfile for image builds in CI.
# Same base + nonroot user + version ldflag as Dockerfile.
#
# VERSION is read from the environment at build time (ko templating):
#   VERSION=v1.2.3 KO_DOCKER_REPO=ghcr.io/passiontech-global/webhook-dispatcher \
#     ko build --sbom=none --tags "$VERSION,latest" ./cmd/dispatcher
defaultBaseImage: gcr.io/distroless/static:nonroot
builds:
  - id: webhook-dispatcher
    main: ./cmd/dispatcher
    ldflags:
      - "-s"
      - "-w"
      - "-X main.version={{ .Env.VERSION }}"
