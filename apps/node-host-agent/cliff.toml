[changelog]
header = ""
body = """\
{% for group, commits in commits | group_by(attribute="group") -%}
### {{ group | upper_first }}
{% for commit in commits -%}
- {{ commit.message | trim | split(pat="\n") | first | trim }} ({{ commit.id | truncate(length=7, end="") }})
{% endfor %}\
{% endfor -%}
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = false
# Monorepo: releases are tagged "node-host-agent/vX.Y.Z" — including
# prerelease/build suffixes (-rc.N, +meta), which release-app.yml
# creates for prerelease runs and treats as release boundaries.
tag_pattern = '^node-host-agent/v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactor" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", group = "Testing" },
  { message = ".*", group = "Other" },
]
