$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'go'
layer: 'application'
stack: 'backend'
tags:
  - 'docker'

# hostkit change -> this project's tasks are affected (moon ci).
dependsOn:
  - 'hostkit'
  - 'jinja'

project:
  title: 'node-host-agent'
  description: 'Per-node agent (DaemonSet) for the kubernetes-node-automation stack.'

tasks:
  # test/vet/lint are defined globally in .moon/tasks/all.yml — the inputs
  # below MERGE with the global list. hostkit is compiled into this module
  # via the go.mod `replace ../../libs/hostkit`, so its sources must
  # invalidate every cache that depends on compiled code (and let
  # `moon ci` treat a touched hostkit file as affecting these tasks).
  #
  # Two non-Go trees also feed the compiled packages:
  #   internal/subsystem/hostconfig/templates/** — go:embed'ed by
  #     hostconfig/cycle.go (compiled into the binary + exercised by
  #     hostconfig tests)
  #   internal/subsystem/hubsync/testdata/** — fixtures read by the
  #     hubsync tests (testdata/vars, testdata/nebula-certs)
  test:
    inputs:
      - '/libs/hostkit/**/*.go'
      - '/libs/hostkit/go.mod'
      - '/libs/hostkit/go.sum'
      - '/libs/jinja/**/*.go'
      - '/libs/jinja/go.mod'
      - '/libs/jinja/go.sum'
      # internal/envdoc's honesty test reads ENV.md — without this input
      # an envdoc-only change never re-runs the test on CI.
      - 'ENV.md'
      - 'internal/subsystem/hostconfig/templates/**'
      - 'internal/subsystem/hubsync/testdata/**'

  vet:
    inputs:
      - '/libs/hostkit/**/*.go'
      - '/libs/hostkit/go.mod'
      - '/libs/hostkit/go.sum'
      - '/libs/jinja/**/*.go'
      - '/libs/jinja/go.mod'
      - '/libs/jinja/go.sum'
      - 'internal/subsystem/hostconfig/templates/**'

  lint:
    inputs:
      - '/libs/hostkit/**/*.go'
      - '/libs/hostkit/go.mod'
      - '/libs/hostkit/go.sum'
      - '/libs/jinja/**/*.go'
      - '/libs/jinja/go.mod'
      - '/libs/jinja/go.sum'
      - 'internal/subsystem/hostconfig/templates/**'
      # golangci-lint resolves its config by walking up to the repo root.
      - '/.golangci.yml'

  build:
    # -tags timetzdata embeds the IANA tz database (cmd/agent/tzdata.go)
    # — the standalone systemd binary runs on hosts that may lack
    # /usr/share/zoneinfo; the pod image builds without the tag.
    script: 'CGO_ENABLED=0 go build -tags timetzdata -trimpath -ldflags "-s -w -X main.version=${VERSION:-dev}" -o bin/node-host-agent ./cmd/agent'
    toolchains: 'system'
    options:
      # script contains an inline env assignment — must run via shell.
      shell: true
    inputs:
      - '$VERSION'
      - 'cmd/**/*.go'
      - 'internal/**/*.go'
      - 'go.mod'
      - 'go.sum'
      - '/libs/hostkit/**/*.go'
      - '/libs/hostkit/go.mod'
      - '/libs/hostkit/go.sum'
      - '/libs/jinja/**/*.go'
      - '/libs/jinja/go.mod'
      - '/libs/jinja/go.sum'
      - 'internal/subsystem/hostconfig/templates/**'
      - '/mise.toml'
    outputs:
      - 'bin/node-host-agent'

  # Regenerate ENV.md — the full NODE_HOST_AGENT_* inventory derived
  # from the Go sources (envx knobs grouped by package + the
  # ENABLE_* gates out of cmd/agent/wiring.go). Deterministic:
  # re-running after an env-surface change refreshes the doc in place.
  envdoc:
    script: 'sh scripts/gen-envdoc.sh'
    toolchains: 'system'
    inputs:
      - 'cmd/**/*.go'
      - 'internal/**/*.go'
      - 'scripts/gen-envdoc.sh'
      # envx knob declarations and the go.mod-replaced hostkit tree feed
      # `go run ./internal/envdoc/cmd/genenvdoc` — touch them too.
      - '/libs/hostkit/**'
      - '/libs/jinja/**'
    outputs:
      - 'ENV.md'
    options:
      # runs a checked-in shell script — must go through the shell.
      shell: true
      cache: false

  image-build:
    # Plain docker build of ./Dockerfile — NOT `ko build`: the shipped
    # image must contain userspace tools (nsenter, ip/ss, ping, sh) in
    # the container fs (nethealth runs `nsenter -t 1 -n -- <argv>` where
    # argv resolves container-side), and ko's defaultBaseImage cannot
    # install packages. (The local-only .ko.yaml fallback was removed —
    # the plain docker build is the only image path.)
    # Builds all release tags locally and pushes nothing — callers
    # (release-app.yml) export KO_DOCKER_REPO + TAGS + VERSION and
    # docker-login before image-push runs.
    # Build context is the repo ROOT (moon runs this script from the
    # project dir) so the go.mod `replace ../../libs/hostkit` target is
    # inside the context; .dockerignore resolution likewise moves to
    # the root .dockerignore.
    script: |
      set -eu
      args=""
      for t in $(echo "${TAGS:-latest}" | tr ',' ' '); do
        args="$args -t ${KO_DOCKER_REPO:?KO_DOCKER_REPO unset}:$t"
      done
      docker build --build-arg "VERSION=${VERSION:-dev}" $args -f "$PWD/Dockerfile" "$PWD/../.."
    toolchains: 'system'
    inputs:
      - 'cmd/**/*.go'
      - 'internal/**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - '/.dockerignore'
      - '/libs/hostkit/**/*.go'
      - '/libs/hostkit/go.mod'
      - '/libs/hostkit/go.sum'
      - '/libs/jinja/**/*.go'
      - '/libs/jinja/go.mod'
      - '/libs/jinja/go.sum'
      - 'internal/subsystem/hostconfig/templates/**'
      - '/mise.toml'
    options:
      # script is a multi-line shell snippet — must run via shell.
      shell: true
      cache: false

  image-push:
    # Pushes the tags image-build just loaded into the local daemon.
    # Login is the caller's job; this task never authenticates itself.
    deps:
      - 'image-build'
    script: |
      set -eu
      for t in $(echo "${TAGS:-latest}" | tr ',' ' '); do
        docker push "${KO_DOCKER_REPO:?KO_DOCKER_REPO unset}:$t"
      done
    toolchains: 'system'
    inputs:
      - '$TAGS'
      - '$KO_DOCKER_REPO'
    options:
      # script is a multi-line shell snippet — must run via shell.
      shell: true
      cache: false

  # Thin composite kept for the release pipeline: release-app.yml runs
  # `moon run <app>:image` — build everything, then push. cache:false
  # so a previously cached composite never satisfies the run without
  # executing its deps.
  image:
    deps:
      - 'image-push'
    options:
      cache: false
