name: Release app (reusable)

# Shared release pipeline for every app in this monorepo. Called by
# .github/workflows/release-<app>.yml — do not run directly.
#
# Flow: resolve version -> git-cliff semver bump (conventional commits,
# scoped to apps/<app>) -> moon vet/test/build -> ko push to GHCR ->
# GitHub Release tagged "<app>/vX.Y.Z".

on:
  workflow_call:
    inputs:
      app:
        description: "App / moon project id (e.g. node-automation-controller)"
        required: true
        type: string
      version:
        description: "Release version (e.g. v0.1.0). Empty = auto semver bump"
        required: false
        default: ""
        type: string
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: false
        default: false
        type: boolean
      legacy_v_tags:
        description: "Also consider bare 'vX.Y.Z' tags (pre-monorepo releases)"
        required: false
        default: false
        type: boolean
    outputs:
      rel_tag:
        description: "Release tag created (e.g. <app>/v1.2.3)"
        value: ${{ jobs.release.outputs.rel_tag }}
      rel_version:
        description: "Release version created (e.g. v1.2.3)"
        value: ${{ jobs.release.outputs.rel_version }}

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      rel_tag: ${{ steps.rel.outputs.rel_tag }}
      rel_version: ${{ steps.rel.outputs.rel_version }}
    env:
      APP: ${{ inputs.app }}
      IMAGE: ghcr.io/passiontech-global/${{ inputs.app }}
      # committed go.work is for local dev; CI resolves deps per-module
      GOWORK: off
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install toolchain (go + git-cliff + ko + moon pinned in mise.toml)
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version and changelog
        id: rel
        run: |
          set -euo pipefail
          version_in="${{ inputs.version }}"

          # Latest release tag for this app. Tag scheme: "<app>/vX.Y.Z";
          # legacy_v_tags additionally considers pre-monorepo "vX.Y.Z"
          # only when no "<app>/vX.Y.Z" tag exists yet (git --sort=-v:refname
          # compares full refnames, so "v0.2.0" would otherwise sort
          # ahead of "node-automation-controller/v0.5.0").
          # versionsort.suffix=- orders prerelease suffixes BEFORE the
          # bare version (v0.1.0-rc.1 < v0.1.0) — without it an rc tag
          # sorts HIGHER than the stable release and wins "latest".
          last_tag=$(git -c versionsort.suffix=- tag -l "$APP/v[0-9]*" --sort=-v:refname | head -1)
          if [ -z "$last_tag" ] && [ "${{ inputs.legacy_v_tags }}" = "true" ]; then
            last_tag=$(git -c versionsort.suffix=- tag -l "v[0-9]*" --sort=-v:refname | head -1)
          fi
          if [ -z "$last_tag" ]; then
            last_tag="$APP/v0.0.0"
            git tag "$last_tag" "$(git rev-list --max-parents=0 HEAD)"
          fi
          last_ver="${last_tag##*/}"

          # Full semver (X.Y.Z with optional -prerelease / +build
          # metadata). Git tags and GitHub release names may carry '+',
          # but docker/ko image tags cannot (their charset is
          # [A-Za-z0-9_.-]), so every version that reaches an image tag
          # goes through the '+'-free REL_DOCKER_VERSION computed below.
          semver_re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          # $1 = version, leading "v" optional; nonzero exit when $1 is
          # not valid semver.
          check_semver() {
            grep -Eq "$semver_re" <<<"${1#v}"
          }

          if [ -n "$version_in" ]; then
            # Accept both "v0.1.0" and "<app>/v0.1.0" spellings.
            rel_version="${version_in##*/}"
            case "$rel_version" in v*) ;; *) rel_version="v$rel_version" ;; esac
            check_semver "$rel_version" || {
              echo "::error::version input '$version_in' is not valid semver (expected vX.Y.Z[-pre][+build])" >&2
              exit 1
            }
          else
            # Anchor git-cliff explicitly at $last_tag..HEAD so a tag
            # created on a multi-commit push whose HEAD did not touch
            # apps/$APP/** is never filtered out by --include-path.
            bumped=$(git-cliff --bumped-version \
              --config "apps/$APP/cliff.toml" \
              --include-path "apps/$APP/**" \
              --include-path "libs/hostkit/**" \
              "$last_tag..HEAD")
            # --bumped-version prints exactly one version line, but
            # git-cliff >= 2.10 echoes it in the matched tag's shape:
            # with "<app>/vX.Y.Z" tags that means
            # "node-automation-controller/v0.33.0", not "0.33.0".
            # Strip the tag prefix and leading "v", then parse the
            # remainder as semver — the old grep-anywhere extraction
            # could match a version quoted inside a commit message.
            cliff_ver="$(head -n 1 <<<"$bumped" | tr -d '[:space:]')"
            cliff_ver="${cliff_ver##*/}"
            cliff_ver="${cliff_ver#v}"
            check_semver "v$cliff_ver" || {
              echo "::error::git-cliff --bumped-version returned non-semver '$cliff_ver'" >&2
              exit 1
            }
            rel_version="v$cliff_ver"
            # No new conventional commits since last tag -> git-cliff
            # echoes the same version; force a patch bump so the
            # release tag never collides.
            if [ "$rel_version" = "$last_ver" ]; then
              case "$last_ver" in
                *-*)
                  # Last tag is a prerelease ("v0.1.0-rc.1") — this
                  # release IS its base version: strip the "-rc.N"
                  # suffix AND any "+build" metadata after it (a
                  # prerelease sorts before its release, so the base
                  # tag cannot exist yet). Bumping patch here would
                  # skip v0.1.0 entirely.
                  rel_version="${last_ver%%+*}"    # drop "+build" (if any)
                  rel_version="${rel_version%%-*}" # drop "-rc.N"
                  ;;
                *)
                  IFS=. read -r major minor patch <<<"${last_ver#v}"
                  # Strip a build-metadata '+' suffix from the last
                  # component ("0+meta") or the arithmetic crashes.
                  major="${major%%+*}"
                  minor="${minor%%+*}"
                  patch="${patch%%+*}"
                  rel_version="v$major.$minor.$((patch + 1))"
                  ;;
              esac
            fi
          fi
          # Docker-safe image-tag variant of REL_VERSION: swap the
          # semver '+' separator for '-' (v1.2.3+build.5 ->
          # v1.2.3-build.5; plain releases and prereleases carry over
          # unchanged). Used ONLY for the container image tag — the
          # git/GitHub release tag keeps the canonical semver form.
          rel_docker_version="${rel_version/+/-}"
          rel_tag="$APP/$rel_version"

          git-cliff --unreleased --tag "$rel_tag" \
            --config "apps/$APP/cliff.toml" \
            --include-path "apps/$APP/**" \
            --include-path "libs/hostkit/**" \
            "$last_tag..HEAD" > changelog.md
          grep -q '[^[:space:]]' changelog.md || echo "No user-facing changes." > changelog.md
          {
            echo "Range: \`$last_tag\` -> \`$rel_tag\`"
            echo ""
            cat changelog.md
          } > notes.md
          cat notes.md

          echo "REL_VERSION=$rel_version" >>"$GITHUB_ENV"
          echo "REL_DOCKER_VERSION=$rel_docker_version" >>"$GITHUB_ENV"
          echo "REL_TAG=$rel_tag" >>"$GITHUB_ENV"
          # Job outputs for callers that need the resolved tag (e.g.
          # the binary-attach job must not re-derive it from git —
          # a stale higher tag could win that lookup).
          echo "rel_version=$rel_version" >>"$GITHUB_OUTPUT"
          echo "rel_tag=$rel_tag" >>"$GITHUB_OUTPUT"

      - name: Vet and test
        run: moon run "$APP:vet" "$APP:test"

      - name: Build static binary
        env:
          VERSION: ${{ env.REL_VERSION }}
        run: |
          moon run "$APP:build"
          file "apps/$APP/bin/$APP"
          "apps/$APP/bin/$APP" --version

      - name: Package assets
        run: |
          set -euo pipefail
          mkdir -p "apps/$APP/dist"
          cp "apps/$APP/bin/$APP" "apps/$APP/dist/$APP-linux-x86_64"
          tar -czf "apps/$APP/dist/$APP-linux-x86_64.tar.gz" -C "apps/$APP/bin" "$APP"
          (cd "apps/$APP/dist" && sha256sum "$APP-linux-x86_64" "$APP-linux-x86_64.tar.gz" > SHA256SUMS.txt)
          cat "apps/$APP/dist/SHA256SUMS.txt"

      - name: Build and push GHCR image (ko, see apps/<app>/.ko.yaml)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ env.REL_VERSION }}
          # Prereleases get the version tag only — they must not move
          # the floating :latest pointer onto a non-stable build.
          # REL_DOCKER_VERSION is REL_VERSION with '+' swapped for '-':
          # docker/ko tags cannot contain '+'.
          TAGS: "${{ env.REL_DOCKER_VERSION }}${{ inputs.prerelease == true && '' || ',latest' }}"
          KO_DOCKER_REPO: ${{ env.IMAGE }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # ko publishes directly: --bare keeps the image name exactly
          # $IMAGE (no <hash> suffix); tags come from --tags.
          moon run "$APP:image"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REL_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          args=(--title "$APP $REL_VERSION" --notes-file notes.md --target "$GITHUB_SHA")
          [ "$REL_PRERELEASE" != "true" ] || args+=(--prerelease)
          # Positional args are uploaded release ASSETS — notes.md is
          # already passed via --notes-file and must not ship as one.
          gh release create "$REL_TAG" "apps/$APP/dist/"* "${args[@]}"
