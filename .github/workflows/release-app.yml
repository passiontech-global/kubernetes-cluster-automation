name: Release app (reusable)

# Shared release pipeline for every app in this monorepo. Called by
# .github/workflows/release-<app>.yml — do not run directly.
#
# Flow: resolve version -> git-cliff semver bump (conventional commits,
# scoped to apps/<app>) -> moon lint/vet/test/build -> ko push to GHCR ->
# GitHub Release tagged "<app>/vX.Y.Z".

on:
  workflow_call:
    inputs:
      app:
        description: "App / moon project id (e.g. node-automation-controller)"
        required: true
        type: string
      version:
        description: "Release version (e.g. v0.1.0). Empty = auto semver bump"
        required: false
        default: ""
        type: string
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: false
        default: false
        type: boolean
      legacy_v_tags:
        description: "Also consider bare 'vX.Y.Z' tags (pre-monorepo releases)"
        required: false
        default: false
        type: boolean
      amd64_alias:
        description: "Also ship a bare '<app>-linux-amd64' binary + .sha256 (host-level installs)"
        required: false
        default: false
        type: boolean
      lib_paths:
        description: "Space-separated repo-relative globs the app's go.mod actually consumes (git-cliff --include-path args)"
        required: false
        default: "libs/hostkit/**"
        type: string
    outputs:
      rel_tag:
        description: "Release tag created (e.g. <app>/v1.2.3)"
        value: ${{ jobs.release.outputs.rel_tag }}
      rel_version:
        description: "Release version created (e.g. v1.2.3)"
        value: ${{ jobs.release.outputs.rel_version }}

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      rel_tag: ${{ steps.rel.outputs.rel_tag }}
      rel_version: ${{ steps.rel.outputs.rel_version }}
    env:
      APP: ${{ inputs.app }}
      IMAGE: ghcr.io/passiontech-global/${{ inputs.app }}
      # committed go.work is for local dev; CI resolves deps per-module
      GOWORK: off
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Release job holds contents:write + packages:write. Nothing
          # here runs `git push` (tags are created locally, auth for
          # gh/docker steps rides GH_TOKEN), so the checkout-scoped
          # credential in .git/config is dead weight and attack
          # surface — drop it.
          persist-credentials: false

      - name: Install toolchain (go + git-cliff + ko + moon pinned in mise.toml)
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Same cache pair as ci.yml — the release job runs moon
      # lint/vet/test plus a cold `go build`; without these every
      # release re-downloads the module graph and rebuilds from
      # scratch.
      - name: Cache Go module + build caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('mise.toml', '**/go.mod', '**/go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Cache moon workspace cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .moon/cache
          key: moon-${{ runner.os }}-${{ github.run_id }}-${{ inputs.app }}
          restore-keys: moon-${{ runner.os }}-

      - name: Compute version and changelog
        id: rel
        env:
          # Workflow-dispatch inputs are interpolated into the job's
          # bash BEFORE parsing — `${{ inputs.* }}` inline in `run:`
          # would let a crafted value escape the quoted context and
          # execute in a job holding contents:write. Route every
          # input through env indirection instead.
          VERSION_INPUT: ${{ inputs.version }}
          PRERELEASE_INPUT: ${{ inputs.prerelease }}
          LEGACY_V_TAGS: ${{ inputs.legacy_v_tags }}
          LIB_PATHS: ${{ inputs.lib_paths }}
          # gh release view below needs API auth to catch a release
          # that exists without its git tag locally.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version_in="$VERSION_INPUT"

          # Space-separated globs -> repeated --include-path args for git-cliff.
          # noglob is load-bearing: the entries ARE globs for git-cliff —
          # bash must not expand them against the checkout first
          # (libs/hostkit/envx/** would collapse to first-level dirs and
          # lose the /** tail, silently dropping every nested commit).
          lib_path_args=()
          set -f
          for g in $LIB_PATHS; do lib_path_args+=(--include-path "$g"); done
          set +f

          # Latest release tag for this app. Tag scheme: "<app>/vX.Y.Z";
          # legacy_v_tags additionally considers pre-monorepo "vX.Y.Z"
          # only when no "<app>/vX.Y.Z" tag exists yet (git --sort=-v:refname
          # compares full refnames, so "v0.2.0" would otherwise sort
          # ahead of "node-automation-controller/v0.5.0").
          # versionsort.suffix=- orders prerelease suffixes BEFORE the
          # bare version (v0.1.0-rc.1 < v0.1.0) — without it an rc tag
          # sorts HIGHER than the stable release and wins "latest".
          last_tag=$(git -c versionsort.suffix=- tag -l "$APP/v[0-9]*" --sort=-v:refname | head -1)
          if [ -z "$last_tag" ] && [ "$LEGACY_V_TAGS" = "true" ]; then
            last_tag=$(git -c versionsort.suffix=- tag -l "v[0-9]*" --sort=-v:refname | head -1)
          fi
          if [ -z "$last_tag" ]; then
            last_tag="$APP/v0.0.0"
            git tag "$last_tag" "$(git rev-list --max-parents=0 HEAD | tail -n 1)"
          fi
          last_ver="${last_tag##*/}"

          # Full semver (X.Y.Z with optional -prerelease / +build
          # metadata). Git tags and GitHub release names may carry '+',
          # but docker/ko image tags cannot (their charset is
          # [A-Za-z0-9_.-]), so every version that reaches an image tag
          # goes through the '+'-free REL_DOCKER_VERSION computed below.
          semver_re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          # $1 = version, leading "v" optional; nonzero exit when $1 is
          # not valid semver.
          check_semver() {
            grep -Eq "$semver_re" <<<"${1#v}"
          }

          # App-scoped tag pattern for git-cliff. The shared root
          # cliff.toml carries a broad union pattern, but --bumped-version
          # echoes the bump in the newest tag matching the pattern — with
          # the union that could be ANOTHER app's tag reachable in the
          # range, deriving this app's version from a foreign number.
          # Override per app (legacy_v_tags also admits bare "vX.Y.Z").
          if [ "$LEGACY_V_TAGS" = "true" ]; then
            tag_pat="^($APP/)?v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$"
          else
            tag_pat="^$APP/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$"
          fi

          if [ -n "$version_in" ]; then
            # Accept both "v0.1.0" and "<app>/v0.1.0" spellings.
            rel_version="${version_in##*/}"
            case "$rel_version" in v*) ;; *) rel_version="v$rel_version" ;; esac
            check_semver "$rel_version" || {
              echo "::error::version input '$version_in' is not valid semver (expected vX.Y.Z[-pre][+build])" >&2
              exit 1
            }
          else
            # Anchor git-cliff explicitly at $last_tag..HEAD so a tag
            # created on a multi-commit push whose HEAD did not touch
            # apps/$APP/** is never filtered out by --include-path.
            bumped=$(git-cliff --bumped-version \
              --config "cliff.toml" \
              --tag-pattern "$tag_pat" \
              --include-path "apps/$APP/**" \
              "${lib_path_args[@]}" \
              "$last_tag..HEAD")
            # --bumped-version prints exactly one version line, but
            # git-cliff >= 2.10 echoes it in the matched tag's shape:
            # with "<app>/vX.Y.Z" tags that means
            # "node-automation-controller/v0.33.0", not "0.33.0".
            # Strip the tag prefix and leading "v", then parse the
            # remainder as semver — the old grep-anywhere extraction
            # could match a version quoted inside a commit message.
            cliff_ver="$(head -n 1 <<<"$bumped" | tr -d '[:space:]')"
            cliff_ver="${cliff_ver##*/}"
            cliff_ver="${cliff_ver#v}"
            check_semver "v$cliff_ver" || {
              echo "::error::git-cliff --bumped-version returned non-semver '$cliff_ver'" >&2
              exit 1
            }
            rel_version="v$cliff_ver"
            # No new conventional commits since last tag -> git-cliff
            # echoes the same version; force a patch bump so the
            # release tag never collides. Compare on the CORE semver —
            # "+build" metadata is not part of version precedence, so
            # "v1.2.3+build.5" and "v1.2.3" are the SAME version and a
            # raw string compare would miss the collision.
            if [ "${rel_version%%+*}" = "${last_ver%%+*}" ]; then
              # Strip "+build" metadata BEFORE the prerelease check:
              # a '-' inside build metadata ("v0.1.0+build-x") is not
              # a prerelease marker — matching *-* on the raw tag
              # would misclassify it and skip the patch bump.
              last_core="${last_ver%%+*}"
              case "$last_core" in
                *-*)
                  # Last tag is a prerelease ("v0.1.0-rc.1") — this
                  # release IS its base version: strip the "-rc.N"
                  # suffix (a prerelease sorts before its release, so
                  # the base tag cannot exist yet). Bumping patch here
                  # would skip v0.1.0 entirely.
                  rel_version="${last_core%%-*}"
                  ;;
                *)
                  IFS=. read -r major minor patch <<<"${last_core#v}"
                  rel_version="v$major.$minor.$((patch + 1))"
                  ;;
              esac
            fi
          fi
          # Prerelease detection runs on the CORE semver — the
          # docker-safe REL_DOCKER_VERSION below swaps '+' for '-',
          # so testing '-' on it would misread "+build" metadata as
          # a prerelease, and testing only '-rc' would miss
          # -alpha/-beta/-SNAPSHOT suffixes. Strip "+build" first,
          # then any '-' in what remains is a real prerelease.
          rel_core="${rel_version%%+*}"
          case "$rel_core" in
            *-*) rel_prerelease=true ;;
            *)   rel_prerelease=false ;;
          esac
          # The workflow_dispatch prerelease checkbox must force the
          # flag even on a stable-looking version — otherwise a manual
          # release of v0.2.0 with prerelease=true would ship stable
          # AND move :latest onto it.
          [ "$PRERELEASE_INPUT" != "true" ] || rel_prerelease=true
          # Docker-safe image-tag variant of REL_VERSION: swap the
          # semver '+' separator for '-' (v1.2.3+build.5 ->
          # v1.2.3-build.5; plain releases and prereleases carry over
          # unchanged). Used ONLY for the container image tag — the
          # git/GitHub release tag keeps the canonical semver form.
          rel_docker_version="${rel_version/+/-}"
          rel_tag="$APP/$rel_version"

          # Fail BEFORE the image push: re-releasing an existing
          # version used to build and overwrite :vX.Y.Z/:latest on
          # GHCR first, then die at `gh release create` — leaving the
          # registry mutated by a release that never published.
          # fetch-depth: 0 makes every remote tag visible locally;
          # the gh check also catches a release whose tag was deleted.
          if git rev-parse -q --verify "refs/tags/$rel_tag" >/dev/null; then
            echo "::error::tag $rel_tag already exists — pick a new version" >&2
            exit 1
          fi
          if gh release view "$rel_tag" >/dev/null 2>&1; then
            echo "::error::GitHub release $rel_tag already exists — pick a new version" >&2
            exit 1
          fi

          git-cliff --unreleased --tag "$rel_tag" \
            --config "cliff.toml" \
            --tag-pattern "$tag_pat" \
            --include-path "apps/$APP/**" \
            "${lib_path_args[@]}" \
            "$last_tag..HEAD" > changelog.md
          grep -q '[^[:space:]]' changelog.md || echo "No user-facing changes." > changelog.md
          {
            echo "Range: \`$last_tag\` -> \`$rel_tag\`"
            echo ""
            cat changelog.md
          } > notes.md
          cat notes.md

          echo "REL_VERSION=$rel_version" >>"$GITHUB_ENV"
          echo "REL_DOCKER_VERSION=$rel_docker_version" >>"$GITHUB_ENV"
          echo "REL_PRERELEASE=$rel_prerelease" >>"$GITHUB_ENV"
          echo "REL_TAG=$rel_tag" >>"$GITHUB_ENV"
          # Job outputs for callers that need the resolved tag (e.g.
          # the binary-attach job must not re-derive it from git —
          # a stale higher tag could win that lookup).
          echo "rel_version=$rel_version" >>"$GITHUB_OUTPUT"
          echo "rel_tag=$rel_tag" >>"$GITHUB_OUTPUT"

      - name: Lint, vet and test
        run: moon run "$APP:lint" "$APP:vet" "$APP:test"

      - name: Build static binary
        env:
          VERSION: ${{ env.REL_VERSION }}
        run: |
          moon run "$APP:build"
          file "apps/$APP/bin/$APP"
          "apps/$APP/bin/$APP" --version

      - name: Package assets
        run: |
          set -euo pipefail
          mkdir -p "apps/$APP/dist"
          cp "apps/$APP/bin/$APP" "apps/$APP/dist/$APP-linux-x86_64"
          tar -czf "apps/$APP/dist/$APP-linux-x86_64.tar.gz" -C "apps/$APP/bin" "$APP"
          (cd "apps/$APP/dist" && sha256sum "$APP-linux-x86_64" "$APP-linux-x86_64.tar.gz" > SHA256SUMS.txt)
          # Host-level installs (k0s controller/hub nodes running the
          # agent as a systemd unit — no kubelet/container runtime pull
          # path on hub non-agent hosts) consume a bare
          # "<app>-linux-amd64" binary + .sha256. Emit them here so
          # they ride the same atomic `gh release create` as the rest
          # of dist/ — a follow-up job would race a 404 window after
          # `gh release create`, and re-uploading a `gh release
          # download` artifact can never restore the exec bit
          # (release assets always download 0644; installers chmod
          # +x after fetch regardless of what was uploaded).
          if [ "${{ inputs.amd64_alias }}" = "true" ]; then
            cp "apps/$APP/dist/$APP-linux-x86_64" "apps/$APP/dist/$APP-linux-amd64"
            chmod +x "apps/$APP/dist/$APP-linux-amd64"
            (cd "apps/$APP/dist" && sha256sum "$APP-linux-amd64" > "$APP-linux-amd64.sha256")
          fi
          cat "apps/$APP/dist/SHA256SUMS.txt"

      - name: Build and push GHCR image (ko, see apps/<app>/.ko.yaml)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ env.REL_VERSION }}
          # Only the resolved version tag is pushed here — the
          # floating :latest pointer is attached AFTER `gh release
          # create` via `docker buildx imagetools create` (see the
          # publish step), so a failed release never leaves :latest
          # moved onto an unpublished build, and prereleases never
          # touch :latest at all. REL_DOCKER_VERSION is REL_VERSION
          # with '+' swapped for '-' (docker/ko tags cannot contain
          # '+').
          TAGS: "${{ env.REL_DOCKER_VERSION }}"
          KO_DOCKER_REPO: ${{ env.IMAGE }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # ko publishes directly: --bare keeps the image name exactly
          # $IMAGE (no <hash> suffix); tags come from --tags.
          moon run "$APP:image"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # REL_PRERELEASE was resolved in the version step from the
          # CORE semver (any '-' prerelease suffix, '+' build metadata
          # stripped first) — covers both the dispatched checkbox and
          # an auto-bumped -alpha/-beta/-rc version alike.
        run: |
          set -euo pipefail
          args=(--title "$APP $REL_VERSION" --notes-file notes.md --target "$GITHUB_SHA")
          [ "$REL_PRERELEASE" != "true" ] || args+=(--prerelease)
          # Positional args are uploaded release ASSETS — notes.md is
          # already passed via --notes-file and must not ship as one.
          gh release create "$REL_TAG" "apps/$APP/dist/"* "${args[@]}"

          # Attach the floating :latest pointer to the EXACT manifest
          # digest just pushed — imagetools retags server-side, so no
          # second `ko build` can drift :latest onto a different digest
          # than the released version tag. Runs only AFTER the release
          # exists (a failed gh release create leaves :latest alone)
          # and never for prereleases.
          if [ "$REL_PRERELEASE" != "true" ]; then
            # --prefer-index=false: imagetools' default wraps the single
            # source manifest in a manifest LIST, giving :latest a
            # different digest than the semver tag (they no longer
            # appear together on the package page). Forcing a plain
            # manifest copy keeps :latest on the SAME digest, matching
            # the old ko --tags "vX.Y.Z,latest" behavior.
            docker buildx imagetools create \
              --prefer-index=false \
              -t "${IMAGE}:latest" "${IMAGE}:${REL_DOCKER_VERSION}"
          fi
