name: Release node-automation-controller

# Releases only this app — other apps in the monorepo are unaffected.
# Pipeline lives in release-app.yml.
#
# Triggers:
#   push main            changes under apps/node-automation-controller
#   workflow_dispatch    gh workflow run release-node-automation-controller.yml [-f version=v0.1.0]

on:
  push:
    branches: [main]
    paths:
      - "apps/node-automation-controller/**"
      # Only the hostkit subpackages this app actually imports
      # (envx/nodecond/timex + transitive logx) — a blanket
      # libs/hostkit/** would fire releases on fsx/httpx changes the
      # controller never consumes, producing empty releases.
      - "libs/hostkit/envx/**"
      - "libs/hostkit/logx/**"
      - "libs/hostkit/nodecond/**"
      - "libs/hostkit/timex/**"
      - ".moon/**"
      - "mise.toml"
      - ".dockerignore"
      - ".github/workflows/release-app.yml"
      - ".github/workflows/release-node-automation-controller.yml"
      - '!**/*.md'
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g. v0.1.0). Empty = auto semver bump"
        required: false
        default: ""
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: release-node-automation-controller
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/release-app.yml
    with:
      app: node-automation-controller
      # All four hostkit subpackages the controller consumes, direct
      # or transitive (envx/nodecond/timex each import logx).
      lib_paths: "libs/hostkit/envx/** libs/hostkit/logx/** libs/hostkit/nodecond/** libs/hostkit/timex/**"
      version: ${{ inputs.version || '' }}
      prerelease: ${{ inputs.prerelease || false }}
      legacy_v_tags: true
    secrets: inherit
