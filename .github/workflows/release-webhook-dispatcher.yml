name: Release webhook-dispatcher

# Releases only this app — other apps in the monorepo are unaffected.
# Pipeline lives in release-app.yml.
#
# Triggers:
#   push main            changes under apps/webhook-dispatcher
#   workflow_dispatch    gh workflow run release-webhook-dispatcher.yml [-f version=v0.1.0]

on:
  push:
    branches: [main]
    paths:
      - "apps/webhook-dispatcher/**"
      # Only the hostkit subpackages this app actually imports
      # (envx/httpx/logx) — see the controller workflow for
      # why the blanket libs/hostkit/** glob is avoided.
      # envdoc is test-only tooling (excluded by go list -deps ./cmd/...).
      # Enforced by internal/releaseglob (go list -deps vs this list).
      - "libs/hostkit/envx/**"
      - "libs/hostkit/httpx/**"
      - "libs/hostkit/logx/**"
      # Subpackage globs don't match module files — the module's dep
      # graph changes fire releases too.
      - "libs/hostkit/go.mod"
      - "libs/hostkit/go.sum"
      - ".moon/**"
      - "mise.toml"
      - ".dockerignore"
      - ".github/workflows/release-app.yml"
      - ".github/workflows/release-webhook-dispatcher.yml"
      - '!**/*.md'
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g. v0.1.0). Empty = auto semver bump"
        required: false
        default: ""
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: release-webhook-dispatcher
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/release-app.yml
    with:
      app: webhook-dispatcher
      lib_paths: "libs/hostkit/envx/** libs/hostkit/httpx/** libs/hostkit/logx/** libs/hostkit/go.mod libs/hostkit/go.sum"
      version: ${{ inputs.version || '' }}
      prerelease: ${{ inputs.prerelease || false }}
    secrets: inherit
