name: CI

# PR gate: runs format/vet/test/build only for moon projects affected
# by the change (`moon ci` compares against the PR base).
#
# Main gate: push to main runs an unconditional lint/vet pass — moon ci
# only sees PR deltas, so without this a change merging without an up
# to date PR check would drift lint on main.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      # committed go.work is for local dev; CI resolves deps per-module
      GOWORK: off
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install toolchain (go + moon pinned in mise.toml)
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check go.work is in sync
        # Nothing else guards go.work: every CI go build runs GOWORK=off
        # (deps resolve per-module), so a stale workspace file never
        # breaks CI — it breaks the next workspace-aware local build.
        # sync must run with GOWORK unset (the job-level GOWORK=off
        # would disable workspace mode and make it a no-op).
        run: |
          env -u GOWORK go work sync
          git diff --exit-code -- go.work go.work.sum

      - name: Run affected tasks
        run: moon ci :format :vet :lint :lint-dockerfile :test :build

  lint-main:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: lint-main-${{ github.ref }}
      cancel-in-progress: true
    env:
      # committed go.work is for local dev; CI resolves deps per-module
      GOWORK: off
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain (go + moon pinned in mise.toml)
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check go.work is in sync
        run: |
          env -u GOWORK go work sync
          git diff --exit-code -- go.work go.work.sum

      - name: Lint and vet main
        run: moon run :format :vet :lint :lint-dockerfile :test :build

  # Build every app image WITHOUT pushing. The release workflows only
  # fire on app-path changes, so nothing else exercises the Dockerfiles
  # (or the root .dockerignore they depend on) before merge. Mirrors the
  # release path exactly: root build context, buildkit (the runner
  # default; the RUN --mount=type=cache layers require it), module mode
  # (go.work is dockerignored). No registry login — nothing is pushed;
  # main-push coverage comes from the release builds themselves.
  docker-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [node-host-agent, node-automation-controller, webhook-dispatcher]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image (no push)
        env:
          APP: ${{ matrix.app }}
        run: docker build -t "kca-$APP:ci" -f "apps/$APP/Dockerfile" .
