name: CI

# PR gate: runs format/vet/test/build only for moon projects affected
# by the change (`moon ci` compares against the PR base).
#
# Main gate: push to main runs an unconditional lint/vet pass — moon ci
# only sees PR deltas, so without this a change merging without an up
# to date PR check would drift lint on main.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      # committed go.work is for local dev; CI resolves deps per-module
      GOWORK: off
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install toolchain (go + moon pinned in mise.toml)
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-${{ hashFiles('**/go.mod', '**/go.sum') }}
          restore-keys: go-mod-${{ runner.os }}-

      - name: Cache Go build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('**/go.mod', '**/go.sum', '**/*.go') }}
          restore-keys: go-build-${{ runner.os }}-${{ hashFiles('mise.toml') }}-

      # .moon/cache holds moon's task cache + the per-project
      # golangci-lint caches (content-addressed, safe to share across
      # runs). Keyed on toolchain/config/source hashes so unchanged runs
      # hit directly instead of churning on every execution.
      - name: Cache moon workspace cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .moon/cache
          key: moon-${{ runner.os }}-${{ hashFiles('mise.toml', '.golangci.yml', '.moon/**', '**/moon.yml', '**/go.mod', '**/go.sum', '**/*.go', 'apps/*/docs/env.md', 'apps/*/ENV.md', '.github/workflows/**') }}
          restore-keys: moon-${{ runner.os }}-

      - name: Check go.work is in sync
        # Nothing else guards go.work: every CI go build runs GOWORK=off
        # (deps resolve per-module), so a stale workspace file never
        # breaks CI — it breaks the next workspace-aware local build.
        # sync must run with GOWORK unset (the job-level GOWORK=off
        # would disable workspace mode and make it a no-op).
        run: |
          env -u GOWORK go work sync
          git diff --exit-code -- go.work go.work.sum

      - name: Run affected tasks
        run: moon ci :format :vet :lint :lint-dockerfile :test :build

      - name: Detect affected ko apps
        id: ko-detect
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF"
          changed=$(git diff --name-only FETCH_HEAD...HEAD)
          nac=false
          wd=false
          while IFS= read -r p; do
            case "$p" in
              ""|*.md|*_test.go) continue ;;
              apps/node-automation-controller/*|libs/hostkit/ledger/*|libs/hostkit/nodecond/*|libs/hostkit/timex/*)
                nac=true ;;
              apps/webhook-dispatcher/*)
                wd=true ;;
              libs/hostkit/envx/*|libs/hostkit/httpx/*|libs/hostkit/logx/*|libs/hostkit/go.mod|libs/hostkit/go.sum|mise.toml)
                nac=true; wd=true ;;
            esac
          done <<< "$changed"
          echo "nac=$nac" >> "$GITHUB_OUTPUT"
          echo "wd=$wd" >> "$GITHUB_OUTPUT"

      # Verify the ko image builds the release pipeline performs —
      # `moon run <app>:image` runs the same `ko build` flags below.
      # Nothing else exercises .ko.yaml + `ko` before a release, and
      # a broken ko config would only surface at release time.
      # KO_DOCKER_REPO=ko.local + --push=false keeps the build
      # registry-free; working-directory picks up each app's
      # .ko.yaml. node-host-agent ships via Dockerfile, not ko.
      - name: Verify ko build (node-automation-controller)
        if: steps.ko-detect.outputs.nac == 'true'
        working-directory: apps/node-automation-controller
        env:
          KO_DOCKER_REPO: ko.local
          # .ko.yaml templates main.version from .Env.VERSION — ko
          # renders missing map keys as an error, so the var must
          # exist even for a throwaway CI build.
          VERSION: ci
        run: ko build --bare --sbom=none --push=false ./cmd/...

      - name: Verify ko build (webhook-dispatcher)
        if: steps.ko-detect.outputs.wd == 'true'
        working-directory: apps/webhook-dispatcher
        env:
          KO_DOCKER_REPO: ko.local
          VERSION: ci
        run: ko build --bare --sbom=none --push=false ./cmd/...

      - name: Run govulncheck
        run: |
          set -euo pipefail
          # mise exports GOBIN (the toolchain's own bin dir), so a bare
          # `go install` does NOT land in GOPATH/bin — pin GOBIN to a
          # temp dir and resolve the binary from the same place.
          export GOBIN="$RUNNER_TEMP/gobin"
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          GOVULN="$GOBIN/govulncheck"
          for m in libs/hostkit libs/jinja apps/webhook-dispatcher apps/node-automation-controller apps/node-host-agent; do
            echo "::group::govulncheck $m"
            (cd "$m" && "$GOVULN" ./...)
            echo "::endgroup::"
          done

      - name: Prune moon cache
        run: moon clean --lifetime "3 days"

  lint-main:
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: lint-main-${{ github.ref }}
      cancel-in-progress: true
    env:
      # committed go.work is for local dev; CI resolves deps per-module
      GOWORK: off
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain (go + moon pinned in mise.toml)
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-${{ hashFiles('**/go.mod', '**/go.sum') }}
          restore-keys: go-mod-${{ runner.os }}-

      - name: Cache Go build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('**/go.mod', '**/go.sum', '**/*.go') }}
          restore-keys: go-build-${{ runner.os }}-${{ hashFiles('mise.toml') }}-

      # Same cache scheme as the PR job above.
      - name: Cache moon workspace cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .moon/cache
          key: moon-${{ runner.os }}-${{ hashFiles('mise.toml', '.golangci.yml', '.moon/**', '**/moon.yml', '**/go.mod', '**/go.sum', '**/*.go', 'apps/*/docs/env.md', 'apps/*/ENV.md', '.github/workflows/**') }}
          restore-keys: moon-${{ runner.os }}-

      - name: Check go.work is in sync
        run: |
          env -u GOWORK go work sync
          git diff --exit-code -- go.work go.work.sum

      - name: Lint and vet main
        run: moon run :format :vet :lint :lint-dockerfile

      # Release workflows skip **/*.md, libs/hostkit/envdoc/**,
      # .golangci.yml, and ci.yml; running :test across all projects
      # here (with .moon/cache hits on unchanged modules) ensures leaf
      # libs and app envdoc/releaseglob tests still run on main pushes.
      - name: Test all modules
        run: moon run :test

      - name: Run govulncheck
        run: |
          set -euo pipefail
          # mise exports GOBIN (the toolchain's own bin dir), so a bare
          # `go install` does NOT land in GOPATH/bin — pin GOBIN to a
          # temp dir and resolve the binary from the same place.
          export GOBIN="$RUNNER_TEMP/gobin"
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          GOVULN="$GOBIN/govulncheck"
          for m in libs/hostkit libs/jinja apps/webhook-dispatcher apps/node-automation-controller apps/node-host-agent; do
            echo "::group::govulncheck $m"
            (cd "$m" && "$GOVULN" ./...)
            echo "::endgroup::"
          done

      - name: Prune moon cache
        run: moon clean --lifetime "3 days"

  # Resolve which app images a PR actually touches BEFORE the
  # docker-build matrix is evaluated (strategy.matrix cannot read a
  # same-job step output). apps/<app>/** maps to that app; libs/
  # changes map to the apps whose dependency graph consumes them —
  # the same split the release workflows' lib_paths encode. An empty
  # result makes docker-build's matrix empty and the job skips.
  docker-detect:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect affected apps
        id: detect
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF"
          changed=$(git diff --name-only FETCH_HEAD...HEAD)
          matrix=$(jq -nc --arg changed "$changed" '
            def consumers($p):
              if ($p | startswith("apps/")) then
                ($p | split("/"))[1] |
                if . == "node-host-agent" or . == "node-automation-controller" or . == "webhook-dispatcher" then [.] else [] end
              elif ($p | startswith("libs/jinja/")) then ["node-host-agent"]
              elif ($p | startswith("libs/hostkit/envx/")) or ($p | startswith("libs/hostkit/httpx/")) or $p == "libs/hostkit/go.mod" or $p == "libs/hostkit/go.sum" then
                ["node-host-agent","node-automation-controller","webhook-dispatcher"]
              elif ($p | startswith("libs/hostkit/logx/")) then ["node-host-agent","node-automation-controller","webhook-dispatcher"]
              elif ($p | startswith("libs/hostkit/nodecond/")) or ($p | startswith("libs/hostkit/timex/")) then ["node-host-agent","node-automation-controller"]
              elif ($p | startswith("libs/hostkit/fsx/")) then ["node-host-agent"]
              elif ($p | startswith("libs/hostkit/ledger/")) then ["node-host-agent","node-automation-controller"]
              elif $p == "mise.toml" then ["node-host-agent","node-automation-controller","webhook-dispatcher"]
              elif $p == ".dockerignore" then ["node-host-agent","node-automation-controller","webhook-dispatcher"]
              else [] end;
            [ $changed | split("\n")[] | select(length > 0) | select((endswith(".md") or endswith("_test.go")) | not) | consumers(.) ]
            | add // [] | unique | {app: .}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "affected apps: $matrix"

  # Build every app image WITHOUT pushing. The release workflows only
  # fire on app-path changes, so nothing else exercises the Dockerfiles
  # (or the root .dockerignore they depend on) before merge. Mirrors the
  # release path: root build context, buildx/buildkit (the RUN
  # --mount=type=cache layers require it), module mode (go.work is
  # dockerignored). No registry login — nothing is pushed; main-push
  # coverage comes from the release builds themselves. GHA registry
  # cache keeps a cold Dockerfile from rebuilding every Go layer on
  # each PR, scoped per app so matrix legs never poison each other.
  # docker-detect narrows the matrix to apps the PR actually touches.
  docker-build:
    needs: docker-detect
    if: github.event_name == 'pull_request' && needs.docker-detect.outputs.matrix != '{"app":[]}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.docker-detect.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          tags: kca-${{ matrix.app }}:ci
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max,ignore-error=true
