name: Release node-host-agent

# Releases only this app — other apps in the monorepo are unaffected.
# Pipeline lives in release-app.yml.
#
# Triggers:
#   push main            changes under apps/node-host-agent
#   workflow_dispatch    gh workflow run release-node-host-agent.yml [-f version=v0.1.0]

on:
  push:
    branches: [main]
    paths:
      - "apps/node-host-agent/**"
      - ".moon/**"
      - "mise.toml"
      - ".github/workflows/release-app.yml"
      - ".github/workflows/release-node-host-agent.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g. v0.1.0). Empty = auto semver bump"
        required: false
        default: ""
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: release-node-host-agent
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/release-app.yml
    with:
      app: node-host-agent
      version: ${{ inputs.version }}
      prerelease: ${{ inputs.prerelease }}
    secrets: inherit
