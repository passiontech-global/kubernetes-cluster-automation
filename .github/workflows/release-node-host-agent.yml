name: Release node-host-agent

# Releases only this app — other apps in the monorepo are unaffected.
# Pipeline lives in release-app.yml.
#
# Triggers:
#   push main            changes under apps/node-host-agent
#   workflow_dispatch    gh workflow run release-node-host-agent.yml [-f version=v0.1.0]

on:
  push:
    branches: [main]
    paths:
      - "apps/node-host-agent/**"
      # Only the hostkit subpackages this app's ./cmd/... actually
      # imports — see the controller workflow for why the blanket
      # libs/hostkit/** glob is avoided. Enforced by
      # internal/releaseglob (go list -deps ./cmd/... vs this list).
      - "libs/hostkit/envx/**"
      - "libs/hostkit/fsx/**"
      - "libs/hostkit/httpx/**"
      - "libs/hostkit/ledger/**"
      - "libs/hostkit/logx/**"
      - "libs/hostkit/nodecond/**"
      - "libs/hostkit/timex/**"
      # Subpackage globs don't match module files — the module's dep
      # graph changes fire releases too.
      - "libs/hostkit/go.mod"
      - "libs/hostkit/go.sum"
      - "libs/jinja/**"
      - ".moon/**"
      - "mise.toml"
      - ".dockerignore"
      - ".github/workflows/release-app.yml"
      - ".github/workflows/release-node-host-agent.yml"
      - '!**/*.md'
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g. v0.1.0). Empty = auto semver bump"
        required: false
        default: ""
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: release-node-host-agent
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/release-app.yml
    with:
      app: node-host-agent
      version: ${{ inputs.version || '' }}
      prerelease: ${{ inputs.prerelease || false }}
      # Host-level installs consume the bare
      # node-host-agent-linux-amd64 binary; release-app.yml emits the
      # alias + .sha256 inside dist/ so it uploads atomically with the
      # release (a follow-up job would download a non-executable 0644
      # asset and race a 404 window after `gh release create`).
      amd64_alias: true
      lib_paths: "libs/hostkit/envx/** libs/hostkit/fsx/** libs/hostkit/httpx/** libs/hostkit/ledger/** libs/hostkit/logx/** libs/hostkit/nodecond/** libs/hostkit/timex/** libs/hostkit/go.mod libs/hostkit/go.sum libs/jinja/**"
    secrets: inherit
