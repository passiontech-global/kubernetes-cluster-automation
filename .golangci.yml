# golangci-lint config (v2 format, golangci-lint 2.x, pinned via mise).
#
# Single root config for all three Go modules under apps/*/: each
# `golangci-lint run ./...` invocation inside an app dir walks up and
# finds this file. Paths in exclusion rules below are relative to the
# app dir golangci-lint runs in, so they only match that app's files.
#
# Linter set: v2 defaults (errcheck, govet, ineffassign, staticcheck,
# unused) plus a small pragmatic set of low-noise correctness/perf
# linters. Deliberately NOT enabled:
#   - gosec: this is infrastructure tooling that execs host commands
#     (nsenter, systemctl, ip/ss) and shells out by design — G204 and
#     friends would flag the codebase's core idiom, not real bugs.
#   - revive/godox/wsl/lll/funlen/gocognit/cyclop/gochecknoinits and
#     other style linters: they force churn without catching bugs.
version: "2"

linters:
  default: standard

  enable:
    - copyloopvar     # unneeded loop-var copies (pre-1.22 idiom)
    - depguard        # import-layer rules (see settings.depguard)
    - misspell        # comment/doc typos
    - nilerr          # `if err != nil { return nil }` swallows errors
    - perfsprint      # faster drop-ins for fmt.Sprintf & friends
    - unconvert       # redundant type conversions
    - usestdlibvars   # http.MethodGet etc. instead of string literals

  settings:
    depguard:
      # Enforces apps/node-host-agent's layering. Empirically, the
      # paths depguard matches `files` against are ABSOLUTE under
      # `golangci-lint run ./...` and `./internal/...`-prefixed under
      # `run ./internal/...` — so the globs use a leading `**/` to
      # cover every form. App scoping comes from the deny `pkg`
      # prefixes, which carry the node-host-agent module path (the
      # other apps have no internal/platform|internal/agent layout
      # anyway). The three real invariants (see
      # apps/node-host-agent/AGENTS.md):
      #   - internal/platform/** is the leaf layer (hoststate,
      #     systemd, ...; envx/logx moved out to libs/hostkit): it
      #     must never import the runtime or domain layers above it.
      #   - internal/agent/** is the runtime (metrics/probe servers +
      #     subsystem supervisor): it must not import the domain
      #     layers either — subsystems get wired in cmd/agent.
      #   - libs/hostkit is the shared stdlib-only leaf module: it
      #     must never import back into an app module.
      # Deliberately NOT denied: internal/subsystem <-> internal/ops
      # cross-imports are the documented two-way convention (domain
      # logic usable by both a periodic subsystem and a one-shot op
      # lives in the lower layer, e.g. ops/kinecheckdb wraps
      # subsystem/kinedb), and cmd/agent may import anything.
      # deny `pkg` is a string prefix — `.../internal/subsystem`
      # covers every .../internal/subsystem/* package too.
      rules:
        nha-platform-is-leaf:
          files:
            - "**/internal/platform/**"
          deny:
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-host-agent/internal/subsystem"
              desc: "internal/platform is the leaf layer; subsystem must not be imported from it (push shared logic down into platform)"
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-host-agent/internal/agent"
              desc: "internal/platform is the leaf layer; the agent runtime must not be imported from it"
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-host-agent/internal/ops"
              desc: "internal/platform is the leaf layer; ops must not be imported from it (push shared logic down into platform)"
        nha-agent-no-domain:
          files:
            - "**/internal/agent/**"
          deny:
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-host-agent/internal/subsystem"
              desc: "internal/agent is the runtime layer; subsystems are wired in cmd/agent, not imported here"
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-host-agent/internal/ops"
              desc: "internal/agent is the runtime layer; ops are wired in cmd/agent, not imported here"
        hostkit-is-leaf:
          files:
            - "**/libs/hostkit/**"
          deny:
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps"
              desc: "libs/hostkit is a shared stdlib-only leaf module; it must not import any app module"
        # node-automation-controller layering (see
        # apps/node-automation-controller/AGENTS.md). Same
        # absolute-path `files` empirics as above; scoping again comes
        # from the deny `pkg` prefixes carrying the app module path.
        # The invariants:
        #   - internal/platform/** is the leaf layer (envx, kube,
        #     state, heal): it must never import anything above it —
        #     not metrics/shared/promq, not the registry, not a
        #     domain module.
        #   - internal/metrics and internal/promq are leaf packages
        #     too: the god-metrics package and the Prometheus client
        #     must never reach upward either.
        #   - internal/shared is the module-contract layer (Deps,
        #     Module, Periodic, SetupWithConfig, CountReconcile): it
        #     may use metrics/platform but never a domain module or
        #     the registry.
        #   - the six domain trees (apiserver, health, integration,
        #     janitor, node, system) are self-contained modules — no
        #     cross-domain imports, and never the registry that wires
        #     them.
        #   - internal/testutil stays generic: fakes must not pull a
        #     domain module in.
        # Deliberately allowed: intra-domain imports (health/datastore
        # → health/probefw, system/corednspatcher →
        # system/pinnedworkload), testutil use in _test.go (excluded
        # from lint anyway), and cmd/manager importing anything.
        nac-platform-is-leaf:
          files:
            - "**/internal/platform/**"
          deny:
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/metrics"
              desc: "internal/platform is the leaf layer; metrics must not be imported from it"
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/shared"
              desc: "internal/platform is the leaf layer; the module contract must not be imported from it"
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/promq"
              desc: "internal/platform is the leaf layer; promq must not be imported from it"
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/registry"
              desc: "internal/platform is the leaf layer; the registry must not be imported from it"
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/testutil"
              desc: "internal/platform is the leaf layer; test fakes must not be imported from it"
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/apiserver"
              desc: "internal/platform is the leaf layer; domain modules must not be imported from it (push shared logic down into platform)"
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/health"
              desc: "internal/platform is the leaf layer; domain modules must not be imported from it (push shared logic down into platform)"
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/integration"
              desc: "internal/platform is the leaf layer; domain modules must not be imported from it (push shared logic down into platform)"
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/janitor"
              desc: "internal/platform is the leaf layer; domain modules must not be imported from it (push shared logic down into platform)"
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/node"
              desc: "internal/platform is the leaf layer; domain modules must not be imported from it (push shared logic down into platform)"
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/system"
              desc: "internal/platform is the leaf layer; domain modules must not be imported from it (push shared logic down into platform)"
        nac-metrics-promq-leaf:
          files:
            - "**/node-automation-controller/internal/metrics/**"
            - "**/node-automation-controller/internal/promq/**"
          deny:
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/platform"
              desc: "metrics/promq are leaf packages; platform must not be imported from them"
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/shared"
              desc: "metrics/promq are leaf packages; the module contract must not be imported from them"
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/registry"
              desc: "metrics/promq are leaf packages; the registry must not be imported from them"
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/apiserver"
              desc: "metrics/promq are leaf packages; domain modules must not be imported from them"
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/health"
              desc: "metrics/promq are leaf packages; domain modules must not be imported from them"
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/integration"
              desc: "metrics/promq are leaf packages; domain modules must not be imported from them"
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/janitor"
              desc: "metrics/promq are leaf packages; domain modules must not be imported from them"
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/node"
              desc: "metrics/promq are leaf packages; domain modules must not be imported from them"
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/system"
              desc: "metrics/promq are leaf packages; domain modules must not be imported from them"
        nac-shared-no-domain:
          files:
            - "**/node-automation-controller/internal/shared/**"
          deny:
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/registry"
              desc: "internal/shared is the module contract layer; the registry must not be imported from it"
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/testutil"
              desc: "internal/shared is the module contract layer; test fakes must not be imported from it"
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/apiserver"
              desc: "internal/shared is the module contract layer; domain modules must not be imported from it"
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/health"
              desc: "internal/shared is the module contract layer; domain modules must not be imported from it"
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/integration"
              desc: "internal/shared is the module contract layer; domain modules must not be imported from it"
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/janitor"
              desc: "internal/shared is the module contract layer; domain modules must not be imported from it"
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/node"
              desc: "internal/shared is the module contract layer; domain modules must not be imported from it"
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/system"
              desc: "internal/shared is the module contract layer; domain modules must not be imported from it"
        nac-domain-isolation:
          files:
            - "**/node-automation-controller/internal/apiserver/**"
            - "**/node-automation-controller/internal/health/**"
            - "**/node-automation-controller/internal/integration/**"
            - "**/node-automation-controller/internal/janitor/**"
            - "**/node-automation-controller/internal/node/**"
            - "**/node-automation-controller/internal/system/**"
          deny:
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/registry"
              desc: "domain modules are wired by the registry; they must never import it back"
        # testutil in domain non-test files: denied everywhere EXCEPT
        # health/probetest — that package IS shared test scaffolding
        # (non-_test so sibling test files can import it).
        nac-domain-no-testutil:
          files:
            - "**/node-automation-controller/internal/apiserver/**"
            - "**/node-automation-controller/internal/health/**"
            - "!**/node-automation-controller/internal/health/probetest/**"
            - "**/node-automation-controller/internal/integration/**"
            - "**/node-automation-controller/internal/janitor/**"
            - "**/node-automation-controller/internal/node/**"
            - "**/node-automation-controller/internal/system/**"
          deny:
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/testutil"
              desc: "test fakes belong in _test.go imports, not module code"
        nac-domain-no-cross:
          files:
            - "**/node-automation-controller/internal/apiserver/**"
          deny:
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/health"
              desc: "domain modules are self-contained; shared logic belongs in platform/shared"
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/integration"
              desc: "domain modules are self-contained; shared logic belongs in platform/shared"
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/janitor"
              desc: "domain modules are self-contained; shared logic belongs in platform/shared"
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/node"
              desc: "domain modules are self-contained; shared logic belongs in platform/shared"
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/system"
              desc: "domain modules are self-contained; shared logic belongs in platform/shared"
        nac-domain-no-cross-health:
          files:
            - "**/node-automation-controller/internal/health/**"
          deny:
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/apiserver"
              desc: "domain modules are self-contained; shared logic belongs in platform/shared"
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/integration"
              desc: "domain modules are self-contained; shared logic belongs in platform/shared"
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/janitor"
              desc: "domain modules are self-contained; shared logic belongs in platform/shared"
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/node"
              desc: "domain modules are self-contained; shared logic belongs in platform/shared"
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/system"
              desc: "domain modules are self-contained; shared logic belongs in platform/shared"
        nac-domain-no-cross-integration:
          files:
            - "**/node-automation-controller/internal/integration/**"
          deny:
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/apiserver"
              desc: "domain modules are self-contained; shared logic belongs in platform/shared"
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/health"
              desc: "domain modules are self-contained; shared logic belongs in platform/shared"
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/janitor"
              desc: "domain modules are self-contained; shared logic belongs in platform/shared"
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/node"
              desc: "domain modules are self-contained; shared logic belongs in platform/shared"
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/system"
              desc: "domain modules are self-contained; shared logic belongs in platform/shared"
        nac-domain-no-cross-janitor:
          files:
            - "**/node-automation-controller/internal/janitor/**"
          deny:
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/apiserver"
              desc: "domain modules are self-contained; shared logic belongs in platform/shared"
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/health"
              desc: "domain modules are self-contained; shared logic belongs in platform/shared"
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/integration"
              desc: "domain modules are self-contained; shared logic belongs in platform/shared"
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/node"
              desc: "domain modules are self-contained; shared logic belongs in platform/shared"
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/system"
              desc: "domain modules are self-contained; shared logic belongs in platform/shared"
        nac-domain-no-cross-node:
          files:
            - "**/node-automation-controller/internal/node/**"
          deny:
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/apiserver"
              desc: "domain modules are self-contained; shared logic belongs in platform/shared"
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/health"
              desc: "domain modules are self-contained; shared logic belongs in platform/shared"
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/integration"
              desc: "domain modules are self-contained; shared logic belongs in platform/shared"
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/janitor"
              desc: "domain modules are self-contained; shared logic belongs in platform/shared"
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/system"
              desc: "domain modules are self-contained; shared logic belongs in platform/shared"
        nac-domain-no-cross-system:
          files:
            - "**/node-automation-controller/internal/system/**"
          deny:
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/apiserver"
              desc: "domain modules are self-contained; shared logic belongs in platform/shared"
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/health"
              desc: "domain modules are self-contained; shared logic belongs in platform/shared"
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/integration"
              desc: "domain modules are self-contained; shared logic belongs in platform/shared"
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/janitor"
              desc: "domain modules are self-contained; shared logic belongs in platform/shared"
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/node"
              desc: "domain modules are self-contained; shared logic belongs in platform/shared"
        nac-testutil-no-domain:
          files:
            - "**/node-automation-controller/internal/testutil/**"
          deny:
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/registry"
              desc: "internal/testutil stays generic; it must not import the registry"
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/apiserver"
              desc: "internal/testutil stays generic; it must not import a domain module"
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/health"
              desc: "internal/testutil stays generic; it must not import a domain module"
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/integration"
              desc: "internal/testutil stays generic; it must not import a domain module"
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/janitor"
              desc: "internal/testutil stays generic; it must not import a domain module"
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/node"
              desc: "internal/testutil stays generic; it must not import a domain module"
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-automation-controller/internal/system"
              desc: "internal/testutil stays generic; it must not import a domain module"

    staticcheck:
      # -QF*: quick-fix style suggestions (De Morgan's law, tagged
      #   switches, WriteString(Sprintf) → Fprintf).
      # -ST1000/-ST1020: doc-comment form requirements. The codebase
      #   deliberately documents every file with `// file.go — purpose`
      #   headers and free-form doc comments instead of the
      #   `Package foo …` / `Foo …` convention; enforcing it would be
      #   pure churn across ~50 files.
      # All real correctness checks (SA*/S*/remaining ST*) stay on.
      checks: ["all", "-QF*", "-ST1000", "-ST1020"]

  exclusions:
    # Test files are exempt from linting entirely — fixture/test
    # scaffolding is allowed best-effort idioms (_ = f(), unchecked
    # closes/writes, deprecated-type fixtures) that production code
    # must not use.
    paths:
      - _test\.go$

issues:
  # No result caps — surface every issue so the list is complete.
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
