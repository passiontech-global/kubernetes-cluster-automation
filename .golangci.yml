# golangci-lint config (v2 format, golangci-lint 2.x, pinned via mise).
#
# Single root config for all three Go modules under apps/*/: each
# `golangci-lint run ./...` invocation inside an app dir walks up and
# finds this file. Paths in exclusion rules below are relative to the
# app dir golangci-lint runs in, so they only match that app's files.
#
# Linter set: v2 defaults (errcheck, govet, ineffassign, staticcheck,
# unused) plus a small pragmatic set of low-noise correctness/perf
# linters. Deliberately NOT enabled:
#   - gosec: this is infrastructure tooling that execs host commands
#     (nsenter, systemctl, ip/ss) and shells out by design — G204 and
#     friends would flag the codebase's core idiom, not real bugs.
#   - revive/godox/wsl/lll/funlen/gocognit/cyclop/gochecknoinits and
#     other style linters: they force churn without catching bugs.
version: "2"

linters:
  default: standard

  enable:
    - copyloopvar     # unneeded loop-var copies (pre-1.22 idiom)
    - depguard        # import-layer rules (see settings.depguard)
    - misspell        # comment/doc typos
    - nilerr          # `if err != nil { return nil }` swallows errors
    - perfsprint      # faster drop-ins for fmt.Sprintf & friends
    - unconvert       # redundant type conversions
    - usestdlibvars   # http.MethodGet etc. instead of string literals

  settings:
    depguard:
      # Enforces apps/node-host-agent's layering. Empirically, the
      # paths depguard matches `files` against are ABSOLUTE under
      # `golangci-lint run ./...` and `./internal/...`-prefixed under
      # `run ./internal/...` — so the globs use a leading `**/` to
      # cover every form. App scoping comes from the deny `pkg`
      # prefixes, which carry the node-host-agent module path (the
      # other apps have no internal/platform|internal/agent layout
      # anyway). The two real invariants (see
      # apps/node-host-agent/AGENTS.md):
      #   - internal/platform/** is the leaf layer (envx, logx,
      #     hoststate, systemd, ...): it must never import the
      #     runtime or domain layers above it.
      #   - internal/agent/** is the runtime (metrics/probe servers +
      #     subsystem supervisor): it must not import the domain
      #     layers either — subsystems get wired in cmd/agent.
      # Deliberately NOT denied: internal/subsystem <-> internal/ops
      # cross-imports are the documented two-way convention (domain
      # logic usable by both a periodic subsystem and a one-shot op
      # lives in the lower layer, e.g. ops/kinecheckdb wraps
      # subsystem/kinedb), and cmd/agent may import anything.
      # deny `pkg` is a string prefix — `.../internal/subsystem`
      # covers every .../internal/subsystem/* package too.
      rules:
        nha-platform-is-leaf:
          files:
            - "**/internal/platform/**"
          deny:
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-host-agent/internal/subsystem"
              desc: "internal/platform is the leaf layer; subsystem must not be imported from it (push shared logic down into platform)"
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-host-agent/internal/agent"
              desc: "internal/platform is the leaf layer; the agent runtime must not be imported from it"
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-host-agent/internal/ops"
              desc: "internal/platform is the leaf layer; ops must not be imported from it (push shared logic down into platform)"
        nha-agent-no-domain:
          files:
            - "**/internal/agent/**"
          deny:
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-host-agent/internal/subsystem"
              desc: "internal/agent is the runtime layer; subsystems are wired in cmd/agent, not imported here"
            - pkg: "github.com/passiontech-global/kubernetes-cluster-automation/apps/node-host-agent/internal/ops"
              desc: "internal/agent is the runtime layer; ops are wired in cmd/agent, not imported here"

    staticcheck:
      # -QF*: quick-fix style suggestions (De Morgan's law, tagged
      #   switches, WriteString(Sprintf) → Fprintf).
      # -ST1000/-ST1020: doc-comment form requirements. The codebase
      #   deliberately documents every file with `// file.go — purpose`
      #   headers and free-form doc comments instead of the
      #   `Package foo …` / `Foo …` convention; enforcing it would be
      #   pure churn across ~50 files.
      # All real correctness checks (SA*/S*/remaining ST*) stay on.
      checks: ["all", "-QF*", "-ST1000", "-ST1020"]

  exclusions:
    # Test files are exempt from linting entirely — fixture/test
    # scaffolding is allowed best-effort idioms (_ = f(), unchecked
    # closes/writes, deprecated-type fixtures) that production code
    # must not use.
    paths:
      - _test\.go$

issues:
  # No result caps — surface every issue so the list is complete.
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
