[changelog]
header = ""
body = """\
{% for group, commits in commits | group_by(attribute="group") -%}
### {{ group | upper_first }}
{% for commit in commits -%}
- {{ commit.message | trim | split(pat="\n") | first | trim }} ({{ commit.id | truncate(length=7, end="") }})
{% endfor %}\
{% endfor -%}
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = false
# Single shared config for every app: release-app.yml passes the app
# name via --include-path, and this pattern admits all three app tag
# prefixes plus legacy bare "vX.Y.Z" tags (pre-monorepo) so changelog
# history stays continuous. The commit range handed to git-cliff is
# always anchored at the app's own last tag by release-app.yml, so the
# wider pattern never pulls another app's commits into a changelog.
# Prerelease/build suffixes (-rc.N, +meta) must match too — release-app.yml
# tags prereleases "<app>/vX.Y.Z-rc.N" and treats them as release
# boundaries, so a pattern ending in [0-9]+$ would make git-cliff skip
# them when it selects tags itself.
tag_pattern = '^((node-automation-controller|node-host-agent|webhook-dispatcher)/)?v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactor" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", group = "Testing" },
  { message = ".*", group = "Other" },
]
