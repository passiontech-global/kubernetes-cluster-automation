$schema: 'https://moonrepo.dev/schemas/tasks.json'

# Tasks inherited by every project tagged `docker` (the three apps ship a
# Dockerfile; hostkit does not). hadolint is pinned in mise.toml — part of
# the `moon ci` PR gate.
inheritedBy:
  tag: 'docker'

tasks:
  lint-dockerfile:
    command: 'hadolint Dockerfile'
    toolchains: 'system'
    inputs:
      - 'Dockerfile'
      # Apps have no per-project .dockerignore — the build context's
      # ignore file lives at the workspace root, so the input must be
      # root-relative or moon warns it doesn't exist and the cache
      # never sees root .dockerignore edits.
      - '/.dockerignore'
      # hadolint is pinned in mise.toml — a toolchain bump must
      # invalidate the lint cache.
      - '/mise.toml'
